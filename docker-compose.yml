version: '3.8'
services:

  postgres-db:
    image: postgres:16.3
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - stock_manager_data:/var/lib/postgresql/data
    ports:
      - 5433:5432

  postgres-db-test:
    image: postgres:16.3
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_TEST_USERNAME}
      POSTGRES_DB: ${DATABASE_TEST_NAME}
      POSTGRES_PASSWORD: ${DATABASE_TEST_PASSWORD}
    volumes:
      - stock_manager_test_data:/var/lib/postgresql/data
    ports:
      - 5434:5432

volumes:
  stock_manager_data:
  stock_manager_test_data: